# Everything the site gathers. Add a feed with a [[feed]] block; the next
# scheduled build picks it up.

[site]
name = "Tuxwire"
tagline = "Linux, tech and emerging tech news, gathered every half hour"
url = "https://velle999.github.io/tuxwire/"
repo = "https://github.com/velle999/tuxwire"
river_days = 4       # how far back the "Latest" list on each page reaches
keep_days = 10       # how long a story stays in the rolling state (trend baseline)
river_max = 220      # most stories listed in "Latest" on one page

# A headline matching any of these (case-insensitive) is never listed.
exclude = [
  '\bpromo codes?\b', '\bcoupons?\b', '\bdiscount codes?\b',
  '\b\d+% off\b', '\$\d[\d,]* off\b', '\bsave \$\d', '\blowest price\b',
  '\ball-time low\b', '\bprime (big deal )?days?\b', '\bblack friday\b',
  '\bcyber monday\b', '\bdrops \d+% today\b', '\bsuper low price\b',
  '^(the )?(\d+ )?best .*\(\d{4}\)', '\bdeals? you can (still )?shop\b',
]

# Headlines from other sections that also belong on the Linux page.
linux_keywords = [
  'linux', 'ubuntu', 'fedora', 'debian', 'gnome', 'kde', 'kde plasma',
  'wayland', 'systemd', 'mesa', 'steamos', 'steam deck', 'proton',
  'flatpak', 'red hat', 'rhel', 'opensuse', 'torvalds', 'gentoo', 'nixos',
  'arch linux', 'linux mint', 'libreoffice', 'raspberry pi', 'freebsd',
]

[sections.linux]
title = "Linux"
blurb = "Kernel, distributions, desktops and Linux gaming"

[sections.tech]
title = "Tech"
blurb = "The wider industry: hardware, software, security and the companies"

[sections.emerging]
title = "Emerging"
blurb = "AI, quantum, space, robotics, energy and research"

# Sidebars, top to bottom. Panels: kernel, distros, hn, lobsters,
# lobsters_linux, github, hf.
[pages.front]
sidebar = ["kernel", "hn", "github", "distros"]
[pages.linux]
sidebar = ["kernel", "distros", "lobsters_linux"]
[pages.tech]
sidebar = ["hn", "lobsters", "github"]
[pages.emerging]
sidebar = ["hf", "github"]

