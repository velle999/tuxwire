# Everything the site gathers. Add a feed with a [[feed]] block; the next
# scheduled build picks it up.

[site]
name = "Tuxwire"
tagline = "Linux, tech, emerging tech and gaming news, gathered every half hour"
url = "https://velle999.github.io/tuxwire/"
repo = "https://github.com/velle999/tuxwire"
river_days = 4       # how far back the "Latest" list on each page reaches
keep_days = 10       # how long a story stays in the rolling state (trend baseline)
river_max = 220      # most stories listed in "Latest" on one page

# A headline matching any of these (case-insensitive) is never listed.
exclude = [
  '\bpromo codes?\b', '\bcoupons?\b', '\bdiscount codes?\b',
  '\b\d+% off\b', '\$\d[\d,]* off\b', '\bsave \$\d', '\blowest price\b',
  '\ball-time low\b', '\bprime (big deal )?days?\b', '\bblack friday\b',
  '\bcyber monday\b', '\bdrops \d+% today\b', '\bsuper low price\b',
  '^(the )?(\d+ )?best .*\(\d{4}\)', '\bdeals? you can (still )?shop\b',
  '\bsave (up to )?\d+%', '\$\d[\d,.]* deal\b',
  '^(get|grab|score|snag|pick up) .*\bfor (just|only|less than|under) \$\d',
]

# A section's keywords: a headline from any other section that contains one
# (a whole word or phrase, any case) is listed on that section's page too.

[sections.linux]
title = "Linux"
blurb = "Kernel, distributions, desktops and Linux gaming"
keywords = [
  'linux', 'ubuntu', 'fedora', 'debian', 'gnome', 'kde', 'kde plasma',
  'wayland', 'systemd', 'mesa', 'steamos', 'steam deck', 'proton',
  'flatpak', 'red hat', 'rhel', 'opensuse', 'torvalds', 'gentoo', 'nixos',
  'arch linux', 'linux mint', 'libreoffice', 'raspberry pi', 'freebsd',
]

[sections.tech]
title = "Tech"
blurb = "The wider industry: hardware, software, security and the companies"

[sections.emerging]
title = "Emerging"
blurb = "AI, quantum, space, robotics, energy and research"

[sections.gaming]
title = "Gaming"
blurb = "PC and console games, Linux gaming, Steam and the games industry"
keywords = [
  'video game', 'video games', 'gaming', 'gamer', 'gamers', 'esports',
  'steam deck', 'steam machine', 'steam frame', 'steam controller', 'steamos',
  'xbox', 'playstation', 'ps5', 'nintendo', 'switch 2', 'game pass',
  'epic games', 'gog', 'itch.io', 'roblox', 'fortnite', 'minecraft', 'twitch',
  'unreal engine', 'godot', 'game developer', 'game developers', 'game studio',
  'game studios',
]

# Sidebars, top to bottom. Panels: kernel, distros, compat (Proton and Wine
# releases), hn, lobsters, lobsters_linux, lobsters_games, github, hf,
# steam (most played on Steam), epic (free on the Epic Games Store).
[pages.front]
sidebar = ["kernel", "hn", "github", "distros"]
[pages.linux]
sidebar = ["kernel", "distros", "compat", "lobsters_linux"]
[pages.tech]
sidebar = ["hn", "lobsters", "github"]
[pages.emerging]
sidebar = ["hf", "github"]
[pages.gaming]
sidebar = ["steam", "compat", "epic", "lobsters_games"]

